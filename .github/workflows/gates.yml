---
# Harmony platform — shared CI gate library (reusable `workflow_call`).
#
# This is a PUBLIC, thin interface so consumers under DIFFERENT GitHub owners
# (Harmony under `ductiletoaster`, FireRisk under the `fire-risk` org) can call
# the SAME gate definitions — cross-owner private reusable-workflow sharing isn't
# possible, so the orchestration lives here in the open. Nothing sensitive is
# here: the actual gate TOOLS + the Semgrep ruleset stay BAKED into the PRIVATE
# `harmony-arc-runner` image (the real trust root). This file only invokes tools
# already on the runner's PATH — via the composite actions in `actions/<gate>/`.
#
# COMPOSITION: each job runs the matching composite action, pinned by COMMIT SHA
# (a reusable workflow can't reference a same-repo action with `./` — GitHub
# resolves that against the CALLER's checkout — so we use the full path @ SHA;
# there's no self-at-SHA syntax yet). Renovate-on-this-repo bumps these internal
# SHAs through a reviewed PR. The action SHA is an ancestor commit on this repo's
# main, so it's immutable — a consumer that pins this workflow by SHA gets a fully
# frozen pipeline (workflow + the exact actions it runs).
#
# SUPPLY-CHAIN NOTE: consume THIS workflow PINNED TO A COMMIT SHA, never `@main`:
#   uses: ductiletoaster/harmony-ci/.github/workflows/gates.yml@<40-char-sha>
# Changes here require PR + review (CODEOWNERS) + this repo's own CI.
#
# REQUIRES: runners built from `harmony-arc-runner` (baked tools + rulesets +
# offline OSV DB). Pass your runner label via the `runner` input.
#
# Gates: gitleaks · semgrep · ruff · osv-scanner · tflint · hadolint — all
# BLOCKING (fail only on NEW regressions on a greened repo). Consumer owns each
# tool's config; the Semgrep ruleset is the one shared, baked config. Type-checking
# is deliberately NOT here — it needs the resolved dependency graph, so it belongs
# in the consumer's own env-aware CI.
name: Gates

on:
  workflow_call:
    inputs:
      runner:
        description: >
          runs-on label for every gate job. Defaults to Harmony's ARC pool; a
          consumer on its own runners (e.g. FireRisk's `fire-risk-ci`) passes its
          label so this reusable workflow isn't pinned to `harmony-cluster`.
        type: string
        required: false
        default: harmony-cluster
    # No secrets required by the current gates.

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # full history so a secret committed anywhere is caught
      - uses: ductiletoaster/harmony-ci/actions/gitleaks@79d44e78b10d97dc2f2337d867f2194932094a3e

  semgrep:
    name: semgrep (SAST)
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ductiletoaster/harmony-ci/actions/semgrep@79d44e78b10d97dc2f2337d867f2194932094a3e

  ruff:
    name: ruff (python lint + format)
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ductiletoaster/harmony-ci/actions/ruff@79d44e78b10d97dc2f2337d867f2194932094a3e

  osv-scanner:
    name: osv-scanner (dependency CVEs)
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ductiletoaster/harmony-ci/actions/osv-scanner@79d44e78b10d97dc2f2337d867f2194932094a3e

  tflint:
    name: tflint (terraform lint)
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ductiletoaster/harmony-ci/actions/tflint@79d44e78b10d97dc2f2337d867f2194932094a3e

  hadolint:
    name: hadolint (dockerfile lint)
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ductiletoaster/harmony-ci/actions/hadolint@79d44e78b10d97dc2f2337d867f2194932094a3e
