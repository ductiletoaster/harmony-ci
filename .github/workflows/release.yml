---
# Semver releases for a repo that is CONSUMED, not built.
#
# harmony-ci ships no artifact: the release IS the tag, because a tag is what
# consumers pin (`uses: ductiletoaster/harmony-ci/actions/<gate>@v1.2.3`). The
# fleet rule is exact-semver pinning, so this repo has to actually produce
# versions to pin — see README "How to consume".
#
# Tag-only, no push to main, so it stays branch-protection-friendly.
#
# NOTE (learned from pixeloven/lattice's release.yml): a tag pushed with
# GITHUB_TOKEN does NOT fire another workflow's `on: push`. Lattice works around
# that by explicitly dispatching its image build for the new tag. harmony-ci
# needs no such dispatch — there is nothing to build on a tag, and the GitHub
# Release below is created in THIS job via the API rather than by a tag-triggered
# workflow. If a tag-triggered workflow is ever added here it will NOT run on its
# own, and must be dispatched explicitly the way lattice does.
name: Release (tag on version change)

on:
  push:
    branches: [main]

permissions:
  contents: write  # create the tag and the GitHub Release

# One release job at a time. Two merges landing close together would otherwise
# both read VERSION, both find no tag, and race to create one — and the loser
# fails on a push that looks like an unrelated git error. cancel-in-progress is
# deliberately FALSE: a cancelled run could have pushed the tag and not yet
# created the Release, leaving a version consumers can pin with nothing to read.
concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  tag:
    name: Tag VERSION
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - name: Tag VERSION and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ver="$(tr -d '[:space:]' < VERSION)"

          # Strict semver (no pre-release / build metadata): consumers pin exact
          # versions, so an unparseable VERSION must fail here rather than
          # produce a tag nobody can pin. ci.yml runs the same check on PRs, so
          # this is the backstop, not the first line of defence.
          if ! printf '%s' "$ver" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error file=VERSION::VERSION is not strict semver: '$ver'"
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/v$ver" >/dev/null; then
            echo "v$ver is already tagged — bump VERSION to cut a release."
            exit 0
          fi

          # Strictly GREATER than everything already released. Branches merge in
          # whatever order review finishes, not in version order: a 2.2.0 bump
          # merging AFTER a 3.0.0 bump would tag v2.2.0 on a tree that already
          # contains the 3.0.0 breaking gate, and a consumer taking what looks
          # like a MINOR would get widened detection with no warning. A tag is
          # immutable once consumers pin it, so this refuses rather than warns.
          # The fix is to bump VERSION again on top, not to re-run this.
          # (fetch-depth: 0 above is what makes the tag list complete here.)
          highest="$(git tag --list 'v*' \
            | sed -n 's/^v\([0-9]\{1,\}\.[0-9]\{1,\}\.[0-9]\{1,\}\)$/\1/p' \
            | sort -V | tail -n1)"
          if [ -n "$highest" ]; then
            newest="$(printf '%s\n%s\n' "$highest" "$ver" | sort -V | tail -n1)"
            # STRICTLY greater, so the equal case is refused here too. The
            # already-tagged check above catches equality first today, which
            # makes this arm unreachable — say it anyway, because a guard that
            # depends on another step running first is one reorder away from
            # being wrong, and `sort -V | tail -n1` reports a tie as a pass.
            if [ "$ver" = "$highest" ] || [ "$newest" != "$ver" ]; then
              echo "::error file=VERSION::VERSION is $ver but v$highest is already" \
                   "released, so tagging this would publish a version AT OR BELOW" \
                   "one consumers can already pin — and this tree contains" \
                   "whatever v$highest shipped. Bump VERSION above $highest and" \
                   "merge again."
              exit 1
            fi
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v$ver"
          git push origin "v$ver"
          echo "Tagged v$ver"

          # A GitHub Release (not just the tag) is what makes the version show up
          # in the releases API and gives consumers somewhere to read what
          # changed before they move their pin.
          gh release create "v$ver" --title "v$ver" --generate-notes --verify-tag
          echo "Published release v$ver" >> "$GITHUB_STEP_SUMMARY"

          # Deliberately NOT publishing a moving `v1` / `v1.2` alias tag. A moving
          # major tag is exactly the floating pin the fleet rule forbids, and
          # publishing one invites the violation it exists to prevent.
