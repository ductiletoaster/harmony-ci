---
name: hadolint (dockerfile lint)
description: >
  Dockerfile lint via the baked hadolint, reading the caller's .hadolint.yaml
  (curated ignore list) from cwd. Skips cleanly when the caller has no
  Dockerfiles. BLOCKING. Requires hadolint on PATH (baked into a self-hosted
  runner image, or installed first).
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        shopt -s globstar nullglob
        files=(**/Dockerfile **/Dockerfile.* **/*.dockerfile)
        if [ ${#files[@]} -eq 0 ]; then
          echo "No Dockerfiles — hadolint skipped." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        hadolint "${files[@]}"
