---
name: skill layout (agent skills)
description: >
  Validate agent skills with Claude Code's own `plugin validate`, then assert the
  layout rules it does not cover — flat files, name/directory mismatch, dangling
  symlinks. Auto-detected: skips cleanly (not silent-green) when the repo ships
  no skills. BLOCKING.
inputs:
  crew-ref:
    description: pixeloven/crew tag carrying the layout checker. Pin it; do not track a branch.
    required: false
    default: v0.28.0
  root:
    description: Repository root to check.
    required: false
    default: "."
  claude-version:
    description: Version of the Claude Code CLI used for native validation.
    required: false
    default: latest
  skilllint-version:
    description: >
      Version of skilllint (PyPI) — 24 rules for manifests, frontmatter, token
      budgets and name/directory agreement. Pin it; a linter that changes under
      you turns a green build red without a commit.
    required: false
    default: "1.17.4"
  codex-version:
    description: Version of the Codex CLI used for the observational check.
    required: false
    default: latest
runs:
  using: composite
  steps:
    - id: detect
      shell: bash
      run: |
        set -euo pipefail
        r='${{ inputs.root }}'
        skills=false
        for d in .agents/skills .claude/skills skills; do
          [ -d "$r/$d" ] && skills=true
        done
        manifest=false
        for m in .claude-plugin/plugin.json .claude-plugin/marketplace.json; do
          [ -f "$r/$m" ] && manifest=true
        done
        echo "skills=$skills"   >> "$GITHUB_OUTPUT"
        echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
        if [ "$skills" = false ]; then
          echo "No .agents/skills, .claude/skills or skills/ — skill-layout skipped." >> "$GITHUB_STEP_SUMMARY"
        fi

    # Claude Code ships its own validator. Prefer it over anything hand-rolled:
    # it is maintained alongside the runtime that has to read these files, and it
    # catches manifest and frontmatter faults, plus the symlink rule (plugin
    # components are read WITHOUT following symlinks) that is easy to get wrong.
    # It needs no credentials — validation is entirely local.
    - if: steps.detect.outputs.manifest == 'true'
      shell: bash
      run: npm install -g @anthropic-ai/claude-code@${{ inputs.claude-version }} >/dev/null 2>&1

    - if: steps.detect.outputs.manifest == 'true'
      shell: bash
      run: |
        set -euo pipefail
        claude plugin validate '${{ inputs.root }}' --strict
        # Component inventory and projected token cost, for the record. A skill
        # catalogue has a context price and it should be visible in the log
        # rather than discovered when a session gets slow.
        name="$(python3 -c "import json,sys;print(json.load(open('${{ inputs.root }}/.claude-plugin/plugin.json'))['name'])" 2>/dev/null || true)"
        if [ -n "$name" ]; then
          claude --plugin-dir '${{ inputs.root }}' plugin details "$name" | tee -a "$GITHUB_STEP_SUMMARY"
        fi

    # skilllint (MIT, bitflight-devops) — 24 rules. Adopted rather than
    # reimplemented: it covers name/directory agreement, description length,
    # REAL token budgets via tiktoken, plugin/marketplace manifests, and
    # description trigger-phrase quality. Everything below it is what remains.
    #
    # Scoped with --filter: unscoped it judges pi's agent files by Claude Code's
    # agent schema and emits two false ERRORS on a healthy repo.
    - if: steps.detect.outputs.skills == 'true'
      shell: bash
      working-directory: ${{ inputs.root }}
      run: |
        set -euo pipefail
        pipx install "skilllint==${{ inputs.skilllint-version }}" >/dev/null 2>&1 \
          || pip install --quiet "skilllint==${{ inputs.skilllint-version }}"

        # MUST run from the repo root. Pointed at a bare skills directory it
        # silently scans NOTHING -- verified by planting a `name:`/directory
        # mismatch, which the root scan reports and the scoped scan does not.
        skilllint check . 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | tee /tmp/skilllint.txt

        python3 - <<'PYEOF'
        import re, pathlib, sys
        lines = pathlib.Path('/tmp/skilllint.txt').read_text().split('\n')
        cur, errs, warns, files = None, [], [], set()
        for ln in lines:
            m = re.match(r'^\s*(\S+\.md)\s*$', ln)
            if m:
                cur = m.group(1); files.add(cur); continue
            if cur and '\u274c' in ln: errs.append((cur, ln.strip()))
            if cur and '\u26a0' in ln: warns.append((cur, ln.strip()))

        # A run that inspected nothing is a failure, not a pass.
        if not files:
            print('::error::skilllint inspected no files — refusing to report a pass')
            sys.exit(1)

        # pi agent files are judged by Claude Code's agent schema and emit false
        # errors on a healthy repo. Excluded from the VERDICT, not from the scan,
        # and the association is per-file rather than per-line -- a line filter
        # cannot work here, because the path and the finding are on different lines.
        blocking = [(f, t) for f, t in errs if '/.pi/agents' not in f and not f.startswith('.pi/agents')]
        print(f'skilllint: {len(files)} file(s), {len(errs)} error(s), {len(warns)} warning(s)')
        for f, t in blocking:
            print(f'::error file={f}::{t}')
        sys.exit(1 if blocking else 0)
        PYEOF

    # What NEITHER `plugin validate` NOR skilllint covers -- both verified
    # against a planted repo: a flat `skills/<name>.md` is silently ignored by
    # both, and a dangling symlink is invisible to both. Those are the two
    # faults that actually shipped, so they still need asserting.
    - if: steps.detect.outputs.skills == 'true'
      shell: bash
      env:
        CREW_REF: ${{ inputs.crew-ref }}
      run: |
        set -euo pipefail
        script="$(mktemp)"
        curl -fsSL --retry 3 --retry-all-errors \
          "https://raw.githubusercontent.com/pixeloven/crew/${CREW_REF}/scripts/check_skill_layout.py" \
          -o "$script"
        # Selftest first: a truncated or wrong-version download would otherwise
        # pass silently, which is the failure mode this gate exists for.
        python3 "$script" --selftest
        python3 "$script" '${{ inputs.root }}'

    # OBSERVATIONAL, and the strongest check here. Everything above is
    # declarative -- it reasons about files. This asks a harness what it
    # ACTUALLY loaded.
    #
    # `codex debug prompt-input` renders the model-visible prompt as JSON with
    # NO API call and no credentials, so the skills listing is ground truth
    # rather than inference.
    #
    # It covers a DIFFERENT failure class from the layout check above. Layout
    # catches a file in the wrong shape; this catches a file in the RIGHT shape
    # that still does not load -- unreadable frontmatter, a harness trust gate,
    # a name collision -- and it is the only way to see the listing BUDGET,
    # where every description degrades at once while every skill still appears
    # present.
    #
    # Codex is the only one of the three that can answer this for free.
    # `claude -p` and `pi -p` both cost an API call, so their half stays
    # declarative above.
    - if: steps.detect.outputs.skills == 'true'
      shell: bash
      run: npm install -g @openai/codex@${{ inputs.codex-version }} >/dev/null 2>&1

    - if: steps.detect.outputs.skills == 'true'
      shell: bash
      working-directory: ${{ inputs.root }}
      run: |
        set -euo pipefail
        CODEX_HOME="$(mktemp -d)"; export CODEX_HOME
        trap 'rm -rf "$CODEX_HOME"' EXIT
        codex debug prompt-input "hi" > /tmp/codex-prompt.json

        python3 - <<'PY'
        import json, os, re, sys, pathlib
        raw = pathlib.Path('/tmp/codex-prompt.json').read_text(errors='replace')
        blob = ''.join(re.findall(r'<skills_instructions>.*?</skills_instructions>', raw, re.S))
        if not blob:
            print('::error::codex rendered no skills section — cannot verify what it loaded')
            sys.exit(1)

        loaded = {}
        for name, desc, path in re.findall(r'\\n- ([a-z0-9:_-]+): (.*?) \(file: ([^)]+)\)', blob):
            loaded[name.split(':')[-1]] = (desc, path)

        expected = set()
        for d in ('.agents/skills', 'skills'):
            base = pathlib.Path(d)
            if base.is_dir():
                expected |= {p.parent.name for p in base.glob('*/SKILL.md')}

        missing = sorted(expected - set(loaded))
        if missing:
            print('::error::Codex did not load: ' + ', '.join(missing))
            print('These exist on disk as <name>/SKILL.md but are absent from the '
                  'model-visible listing — the exact silent failure this gate exists for.')
            sys.exit(1)

        # The listing is byte-budgeted: past the cap Codex truncates EVERY
        # description rather than dropping a skill, so the discovery mechanism
        # degrades catalogue-wide while every skill still appears present.
        truncated = [n for n, (d, _) in loaded.items() if d.rstrip().endswith(('...', '…'))]
        if truncated:
            print(f'::warning::Codex truncated {len(truncated)} description(s) — '
                  f'the listing is over budget: {", ".join(sorted(truncated)[:5])}')

        print(f'codex loaded all {len(expected)} skill(s) from disk')
        PY
