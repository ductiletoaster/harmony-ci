---
name: python-test (pytest via uv)
description: >
  Python tests via the CALLER's own pinned pytest (`uv run pytest`), running in
  the consumer's uv env (needs the resolved deps). Auto-detected: skips cleanly
  (not silent-green) when the repo has no pyproject.toml. Requires uv on PATH:
  baked into harmony-arc-runner; on github-hosted, run astral-sh/setup-uv first.
  Pass extra flags (paths, -k, -m, coverage, …) via `args`.
inputs:
  args:
    description: "Extra arguments appended to `uv run pytest` (e.g. '-q --cov')."
    required: false
    default: ""
runs:
  using: composite
  steps:
    - id: detect
      shell: bash
      run: |
        if [ -f pyproject.toml ]; then
          echo "python=true" >> "$GITHUB_OUTPUT"
        else
          echo "python=false" >> "$GITHUB_OUTPUT"
          echo "No pyproject.toml — python-test skipped." >> "$GITHUB_STEP_SUMMARY"
        fi
    - if: steps.detect.outputs.python == 'true'
      shell: bash
      # args passed via env (not interpolated into the script text); unquoted
      # expansion is intentional so multiple flags word-split into pytest.
      env:
        PYTEST_ARGS: ${{ inputs.args }}
      run: uv run pytest $PYTEST_ARGS
