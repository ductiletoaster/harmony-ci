---
# ci-arc.yml — inline CI on a harmony-arc-runner (COPY-AND-ADAPT STARTING POINT)
#
# A convenient starting point for a repo WITH ARC access (a self-hosted runner
# built from the private harmony-arc-runner image, which bakes the gate tools +
# rulesets + the offline OSV DB). GUIDANCE.md explains the reasoning behind the
# tiers below. Everything here is optional — keep what fits, delete the rest.
#
# TO USE (adapt freely):
#   1. Copy this file to YOUR repo as .github/workflows/ci.yml
#   2. Replace every `<YOUR-ARC-LABEL>` with your ARC pool label
#      (e.g. `harmony-cluster`, `fire-risk-ci`, `lattice`).
#   3. Uncomment the code-quality block(s) for YOUR stack (Python/Node/IaC/Docker).
#   4. (Optional) Add templates/security-scan.yml for a scheduled depth sweep.
#   5. (Optional) If you want these to block merges, mark them required in branch
#      protection — your call (see GUIDANCE.md).
#
# The composite actions below are pinned to an EXACT harmony-ci semver tag —
# never @main, never a bare major. Bump the version however you like
# (Renovate/Dependabot/by hand); the release notes say what changed.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── SECURITY FLOOR (suggested: run inline; gate on NEW regressions) ────────
  # Env-independent scanners from the harmony-ci composite-action library. If you
  # gate them, they trip only on a NEW finding on a greened repo (baselined
  # residue is grandfathered by the tool's own config: osv-scanner.toml, semgrep
  # baseline). Drop any job you don't want.

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: <YOUR-ARC-LABEL>  # e.g. harmony-cluster / fire-risk-ci / lattice
    steps:
      # gitleaks scans the full history, so fetch-depth: 0 is REQUIRED.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: ductiletoaster/harmony-ci/actions/gitleaks@v2.0.0

  semgrep:
    name: semgrep (SAST)
    runs-on: <YOUR-ARC-LABEL>  # e.g. harmony-cluster / fire-risk-ci / lattice
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Uses the baked, tokenless ruleset (/opt/semgrep/harmony-baseline.yaml).
      # This is WHY arc is the recommended path — no SEMGREP_APP_TOKEN needed.
      - uses: ductiletoaster/harmony-ci/actions/semgrep@v2.0.0

  osv-scanner:
    name: osv-scanner (dependency CVEs)
    runs-on: <YOUR-ARC-LABEL>  # e.g. harmony-cluster / fire-risk-ci / lattice
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Reads the offline baked DB (egress-free). Seeded ecosystems:
      # PyPI/npm/Go/Cargo — an unseeded ecosystem needs a runner-image seed entry.
      - uses: ductiletoaster/harmony-ci/actions/osv-scanner@v2.0.0

  dependency-review:
    name: dependency-review (PR only)
    # PR-only: this action inspects the PR's dependency delta and has no meaning
    # on a push to main. It is GitHub-hosted (not a baked-image gate), so it can
    # run on ubuntu-latest even on an arc-first repo.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high

  # agent-skills:
  #   name: skill layout
  #   runs-on: ubuntu-latest
  #   # Only for repos shipping agent skills. Layout is what fails SILENTLY:
  #   # frontmatter can be perfect while the file sits where no harness reads it.
  #   # One consumer ran 26 local skills invisible to every Claude Code session
  #   # for months, with no error anywhere.
  #   if: hashFiles('.agents/skills/**', '.claude/skills/**', 'skills/**') != ''
  #   steps:
  #     - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
  #     # The RULE lives in pixeloven/crew, pinned by tag; this action is only
  #     # the plumbing, so there is one definition rather than a copy per repo --
  #     # copies are the drift this gate exists to catch.
  #     - uses: ductiletoaster/harmony-ci/actions/skill-layout@v2.0.0

  # ── CODE QUALITY (suggested: run inline) ──────────────────────────────────
  # UNCOMMENT the block(s) for YOUR stack. lint+format → typecheck → tests.
  # These run on the baked arc image (uv/ruff/tools pre-installed). Auto-detect
  # via `if: hashFiles(...)` where it keeps the block safe on a mixed repo.

  # python:
  #   name: python · lint · typecheck · test
  #   runs-on: <YOUR-ARC-LABEL>
  #   # Runs only when the repo actually contains Python config.
  #   if: hashFiles('pyproject.toml') != ''
  #   steps:
  #     - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
  #     # The python-* language-pack actions run YOUR OWN pinned ruff/mypy/pytest
  #     # via `uv run` (uv is baked into harmony-arc-runner) — so CI matches local
  #     # dev exactly. Granular on purpose: drop the type-check, or swap its
  #     # checker, without touching lint or test. Pin to a harmony-ci version that
  #     # includes the python-* actions. (Want parallel jobs + distinct checks?
  #     # Split these three into their own jobs and add each to the aggregator.)
  #     - uses: ductiletoaster/harmony-ci/actions/python-lint@v2.0.0
  #     - uses: ductiletoaster/harmony-ci/actions/python-typecheck@v2.0.0
  #       # with: { type-checker: basedpyright }  # default is mypy (fleet standard)
  #     - uses: ductiletoaster/harmony-ci/actions/python-test@v2.0.0

  # node:
  #   name: node · biome · tsc · test
  #   runs-on: <YOUR-ARC-LABEL>
  #   if: hashFiles('package.json') != ''
  #   steps:
  #     - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
