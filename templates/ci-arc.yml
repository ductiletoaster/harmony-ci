  #       run: terraform validate
  #     # tflint is also available as a harmony-ci composite action if you prefer
  #     # the baked, egress-free variant: ductiletoaster/harmony-ci/actions/tflint.
  #     - name: tflint
  #       run: tflint --recursive --format compact

  # docker:
  #   name: docker · hadolint
  #   runs-on: <YOUR-ARC-LABEL>
  #   if: hashFiles('**/Dockerfile', '**/Dockerfile.*', '**/*.dockerfile') != ''
  #   steps:
  #     - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
  #     # Or use the baked composite action:
  #     # ductiletoaster/harmony-ci/actions/hadolint@v2.0.0
  #     - name: hadolint
  #       run: hadolint $(git ls-files '**/Dockerfile' '**/Dockerfile.*' '**/*.dockerfile')

  # ── AGGREGATOR (a convenient single check) ────────────────────────────────
  # https://github.com/marketplace/actions/alls-green#why
  # A single, stable job that's green only if everything it `needs` passed. IF you
  # decide to make CI block merges, this is a handy one check to require (so
  # adding a language toggle later doesn't mean editing branch protection). Keep
  # it on ubuntu-latest: re-actors/alls-green exit-127s on the arc image, and it
  # needs no baked tooling. Add every code-quality job you uncommented to `needs`.
  ci-alls-green:
    name: CI all green
    if: always()
    needs:
      - gitleaks
      - semgrep
      - osv-scanner
      - dependency-review
      # - python
      # - node
      # - iac
      # - docker
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
          # dependency-review is skipped on push (PR-only); allow that.
          allowed-skips: dependency-review
