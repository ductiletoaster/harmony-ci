  #       run: tflint --recursive --format compact

  # docker:
  #   name: docker · hadolint
  #   runs-on: ubuntu-latest
  #   if: hashFiles('**/Dockerfile', '**/Dockerfile.*', '**/*.dockerfile') != ''
  #   steps:
  #     - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
  #     - uses: hadolint/hadolint-action@v3.1.0
  #       with:
  #         recursive: true

  # ── AGGREGATOR (a convenient single check) ────────────────────────────────
  # https://github.com/marketplace/actions/alls-green#why
  # Green only if everything it `needs` passed. IF you decide to make CI block
  # merges, this is a handy one check to require. Add every code-quality job you
  # uncommented (and semgrep, if enabled) to `needs`.
  ci-alls-green:
    name: CI all green
    if: always()
    needs:
      - gitleaks
      - osv-scanner
      - dependency-review
      # - semgrep
      # - python
      # - node
      # - iac
      # - docker
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
          # dependency-review is skipped on push (PR-only); allow that.
          allowed-skips: dependency-review
