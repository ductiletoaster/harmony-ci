---
# ci-github-hosted.yml — the security floor on ubuntu-latest, NO baked image
# (COPY-AND-ADAPT STARTING POINT).
#
# START HERE. This is the default: it needs no self-hosted pool, no baked image
# and no cluster — tools come from public marketplace actions and on-the-fly
# installs. GUIDANCE.md explains the reasoning. Keep what fits, delete the rest.
# ci-arc.yml is the same floor for repos that DO have a pool whose image bakes
# the tools, which buys egress-free determinism at the cost of DB freshness.
#
# WHAT THIS TEMPLATE IS NOT. Every gate below is a PUBLIC action, not one of
# harmony-ci's. You get the same TOOLS; you do not get this library's coverage
# assertions, which live in actions/* and run a tool that is already on PATH.
# Concretely, on this template: a shallow checkout is not refused, a zero-commit
# or zero-PACKAGE scan is not refused, and a gitignored uv.lock scans NOTHING
# and still reports a green check. Put the tool on PATH first (one install step)
# and swap `uses:` to ductiletoaster/harmony-ci/actions/<gate> to get them here.
#
# github-hosted vs a baked image (see the SAST caveat below):
#   gitleaks           same binary (gitleaks/gitleaks-action), no depth/scope
#                      assertion and no coverage summary
#   osv-scanner        FRESHER here — ONLINE osv.dev (google/osv-scanner-action),
#                      where a baked offline DB is only as current as its image.
#                      No --all-packages and no --no-ignore, so coverage is
#                      unasserted: see the job below.
#   dependency-review  same (actions/dependency-review-action), needs the
#                      dependency graph — and GHAS on a private repo
#   semgrep            NEEDS a token OR a vendored ruleset — see below.
#
# TO USE (adapt freely):
#   1. Copy this file to YOUR repo as .github/workflows/ci.yml
#   2. Uncomment the code-quality block(s) for YOUR stack (all public tools).
#   3. (Optional) Add templates/security-scan.yml for a scheduled depth sweep.
#   4. (Optional) If you want these to block merges, mark them required — your
#      call (see GUIDANCE.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── SECURITY FLOOR (suggested: run inline; gate on NEW regressions) ────────
  # Sourced from public actions — no baked runner needed. The WORKING floor on
  # github-hosted is gitleaks + osv-scanner + dependency-review (semgrep needs
  # extra setup — see its job). Drop any job you don't want.

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      # gitleaks scans the full history, so fetch-depth: 0 is REQUIRED — and
      # nothing below CHECKS that you kept it. The public action scans whatever
      # clone it is given: drop this `with:` block and the job scans the tip
      # commit and reports green. actions/gitleaks refuses that clone instead.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PIN THE SCANNER, NOT JUST THE ACTION. The SHA above pins a wrapper
          # around a binary it DOWNLOADS at run time; unset, GITLEAKS_VERSION
          # means LATEST, so this gate silently re-tools itself every run and an
          # upstream rule change lands as an unexplained red PR. Bump this
          # deliberately. Same reasoning, at length, in security-scan.yml.
          GITLEAKS_VERSION: "8.30.1"
          # GITLEAKS_LICENSE is only required for GitHub *Organizations*. Set it
          # as a repo/org secret if this repo lives under an org account. It is
          # NOT needed for personal-account repos.

  osv-scanner:
    name: osv-scanner (dependency CVEs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # ONLINE osv.dev DB (github-hosted has egress) — no baked offline DB.
      # Reads the repo's lockfiles natively (uv.lock, requirements.txt,
      # package-lock.json, …). Scans recursively; a non-zero exit blocks the job.
      # To grandfather accepted residue, add a repo-root osv-scanner.toml.
      # COVERAGE IS NOT ASSERTED HERE. This is the public action, and
      # `--recursive ./` passes neither --all-packages nor --no-ignore: the
      # directory walk honours .gitignore, so a repo that gitignores its
      # lockfile prints "No package sources found" and this job goes GREEN
      # having examined nothing. ductiletoaster/harmony-ci/actions/osv-scanner
      # fails that case instead, but wants osv-scanner AND an offline DB on the
      # runner — which is what the baked image in ci-arc.yml is for.
      # (If you want SARIF in the Security tab, switch to the reusable workflow at
      # google/osv-scanner-action/.github/workflows/osv-scanner-*.yml and grant
      # security-events: write.)
      - uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --recursive
            ./

  dependency-review:
    name: dependency-review (PR only)
    # PR-only: inspects the PR's dependency delta; no meaning on a push to main.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high

  # ── SAST CAVEAT (semgrep needs rules from somewhere) ──────────────────────
  # Semgrep's registry rulesets (p/*, `auto`) are LOGIN-GATED: tokenless they
  # resolve to ZERO rules, report nothing and exit 0 — a green that means
  # "nothing was scanned". So semgrep needs ONE of:
  #   (A) a SEMGREP_APP_TOKEN secret (Semgrep Cloud / registry rules), OR
  #   (B) a VENDORED ruleset committed to your repo (e.g. .semgrep/rules.yml).
  # The floor above (gitleaks + osv + dependency-review) works WITHOUT either.
  # Uncomment ONE variant once you've chosen an approach.
  #
  # Variant B can use the harmony-ci action rather than a raw command: it takes
  # a `config:` input, asserts the binary and the ruleset are both really there,
  # and REFUSES a registry name outright instead of scanning with no rules.
  #
  # semgrep:
  #   name: semgrep (SAST)
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
  #     - uses: astral-sh/setup-uv@v6
  #     # Variant A — registry rules via a token (requires SEMGREP_APP_TOKEN secret):
  #     # - run: uvx semgrep ci
  #     #   env:
  #     #     SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
  #     # Variant B — a ruleset you vendor into the repo (no token, no login):
  #     - run: uv tool install semgrep
  #     - uses: ductiletoaster/harmony-ci/actions/semgrep@v2.2.0
  #       with: { config: .semgrep/rules.yml }

  # agent-skills:
  #   name: skill layout
  #   runs-on: ubuntu-latest
  #   # Only for repos shipping agent skills. Layout is what fails SILENTLY:
  #   # frontmatter can be perfect while the file sits where no harness reads it.
  #   # One consumer ran 26 local skills invisible to every Claude Code session
  #   # for months, with no error anywhere.
  #   if: hashFiles('.agents/skills/**', '.claude/skills/**', 'skills/**') != ''
  #   steps:
  #     - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
  #     # The RULE lives in pixeloven/crew, pinned by tag; this action is only
  #     # the plumbing, so there is one definition rather than a copy per repo --
  #     # copies are the drift this gate exists to catch.
  #     - uses: ductiletoaster/harmony-ci/actions/skill-layout@v2.2.0

  # ── CODE QUALITY (suggested: run inline) ──────────────────────────────────
  # UNCOMMENT the block(s) for YOUR stack. lint+format → typecheck → tests.
  # All public tools, so these behave identically to the arc template. Auto-
  # detect via `if: hashFiles(...)` where it keeps the block safe on a mixed repo.

  # python:
  #   name: python · lint · typecheck · test
  #   runs-on: ubuntu-latest
  #   if: hashFiles('pyproject.toml') != ''
  #   steps:
  #     - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
  #     # No baked uv on github-hosted → install it first; the python-* actions
  #     # then run YOUR OWN pinned ruff/mypy/pytest via `uv run`.
  #     - uses: astral-sh/setup-uv@v6
  #     # Granular: drop the type-check, or swap its checker, without touching
  #     # lint or test. Pin to a harmony-ci version that ships the python-* actions.
  #     - uses: ductiletoaster/harmony-ci/actions/python-lint@v2.2.0
  #     - uses: ductiletoaster/harmony-ci/actions/python-typecheck@v2.2.0
  #       # with: { type-checker: basedpyright }  # default is mypy
  #     - uses: ductiletoaster/harmony-ci/actions/python-test@v2.2.0

