  #       with:
  #         node-version: 22
  #     - name: Install dependencies
  #       run: npm ci
  #     - name: Biome check (lint + format)
  #       run: npx @biomejs/biome check .
  #     - name: Typecheck
  #       run: npx tsc --noEmit
